version: '3.8'

# Global mode: Long-running container with persistent workspace
# Use with: docker compose -f compose.base.yml -f compose.global.yml up

services:
  claude:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-docker-global

    volumes:
      - ../workspace:/workspace

    # Fixed localhost-only port band so servers started inside the long-lived
    # global container are viewable from the host (a running container can't
    # gain ports later). Takes effect when the container is (re)created:
    #   docker rm -f claude-docker-global
    ports:
      - "127.0.0.1:3000-3010:3000-3010"

    # Keep container running for docker exec access
    command: ["/setup-container/keep-alive.sh"]

    restart: unless-stopped
