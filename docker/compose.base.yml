version: '3.8'

# Shared configuration for all Claude containers
# Use with: docker compose -f compose.base.yml -f compose.global.yml up

services:
  claude:
    platform: linux/arm64
    image: claude-dev-ubuntu:latest

    volumes:
      # Mount setup scripts directory
      - ./scripts:/setup-container:ro

      # Mount configuration files
      - ../config/bashrc:/etc/bash.bashrc:ro
      - ../config/starship.toml:/root/.config/starship.toml:ro
      - ../config/.gitconfig:/etc/gitconfig:ro
      - ../config/gh-config.yml:/etc/gh/config.yml:ro
      - ../config/.claude-ailo-style-guide-config.json:/root/.claude-ailo-style-guide-config.json:rw

      # Mount workspace context so Claude auto-loads it in both modes
      # (in global mode the ../workspace mount provides the same files)
      - ../workspace/CLAUDE.md:/workspace/CLAUDE.md:ro
      - ../workspace/repos/CLAUDE.md:/workspace/repos/CLAUDE.md:ro

      # Shared persistent nix store: seeded from the image's /nix on first use,
      # then shared across all claude-docker containers so builds are cached once.
      # Refresh after a nix upgrade with: docker volume rm claude-docker-nix
      - nix-store:/nix

      # Mount Claude config from host (shared read/write for persistent settings)
      - ${HOME}/.claude.json:/root/.claude.json:rw
      - ${HOME}/.claude:/root/.claude:rw

    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GH_TOKEN=${GITHUB_TOKEN:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - NPM_TOKEN=${NPM_TOKEN:-}
      - HOST_HOME=${HOST_HOME:-}
      - NODE_ENV=development
      - FORCE_COLOR=true
      - IS_SANDBOX=1

    stdin_open: true
    tty: true

volumes:
  nix-store:
    name: claude-docker-nix
